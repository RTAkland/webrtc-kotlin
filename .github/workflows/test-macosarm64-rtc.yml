name: Run datachannel macOS ARM64 Test

on:
  workflow_dispatch:

jobs:
  test-macos-arm64:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run macosArm64 test
        run: |
          ./gradlew :datachannel:cleanMacosArm64Test :datachannel:macosArm64Test \
            --tests "test.TestRTCNoACK" \
            --stacktrace
        continue-on-error: true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macosArm64-test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: warn
          retention-days: 14